name: Build Android APK (C++ & AdMob)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build C++ Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK and Accept Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          if [ -d "$ANDROID_NDK_HOME" ]; then
            echo "ndk.dir=$ANDROID_NDK_HOME" >> android/local.properties
            echo "Found NDK at: $ANDROID_NDK_HOME"
          elif [ -d "$ANDROID_NDK" ]; then
            echo "ndk.dir=$ANDROID_NDK" >> android/local.properties
            echo "Found NDK at: $ANDROID_NDK"
          fi
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare Gradle Wrapper
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.5 || true
          chmod +x gradlew || true

      - name: Build Debug APK
        working-directory: ./android
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Build Release APK
        working-directory: ./android
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon || true
          else
            gradle assembleRelease --stacktrace --no-daemon || true
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArrowPuzzle-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArrowPuzzle-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
